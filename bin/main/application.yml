spring:
  application:
    name: smartbus-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartbus}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  # Render injects PORT; keep SERVER_PORT for local override.
  port: ${PORT:${SERVER_PORT:8080}}
  address: 0.0.0.0
  servlet:
    context-path: /api

security:
  jwt:
    
    secret: ${JWT_SECRET:local-dev-only-change-me-32bytes-min!!}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}

smartbus:
  gps:
    stop-proximity-meters: ${GPS_STOP_PROXIMITY_METERS:50}

ai:
  provider: ${AI_PROVIDER:openrouter}
  api-key: ${AI_API_KEY:}
  base-url: ${AI_BASE_URL:https://openrouter.ai/api/v1}
  model: ${AI_MODEL:deepseek/deepseek-chat}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.smartbus: DEBUG
